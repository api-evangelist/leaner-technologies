aid: leaner-technologies
name: Leaner Technologies
description: 'Leaner Technologies (株式会社Leaner Technologies) is a Tokyo-based B2B SaaS company
  founded on February 22, 2019 by CEO Yusuke Ohira, operating under the mission "調達のスタンダードを刷新し続ける"
  (continuously renew the standard of procurement). It builds the "Leaner" (リーナー) cloud suite for
  corporate procurement and purchasing departments: Leaner購買 (purchasing), a purchase-to-pay system
  covering quotation, approval workflow, ordering, receiving and payment; Leaner sourcing, a quotation
  and sourcing workspace; Leaner Connect, an SRM supplier-relationship platform; plus procurement BPO
  and consulting services. The platform aggregates supplier and EC catalogs (including Amazon Business
  and MonotaRO) into cross-catalog search, and applies AI to classify purchasing data for indirect-spend
  visibility and cost optimization. The company holds ISMS ISO/IEC 27001:2013 / JIS Q 27001:2014
  certification (registration JP21/080659, February 2021). Leaner publishes no public developer portal,
  API reference, or client SDKs as of this enrichment pass — its integration surface is delivered
  through partner catalog connections rather than a self-serve API program.'
